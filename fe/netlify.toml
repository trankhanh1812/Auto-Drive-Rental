[build]
  base = "fe"
  command = "npm run build"
  publish = "."

[build.environment]
  # Exclude NEXT_PUBLIC_* variables from secret scanning
  # These are intentionally public and embedded in the client bundle
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_API_URL,NEXT_PUBLIC_GOONG_API_KEY,NEXT_PUBLIC_GOONG_MAPTILES_KEY"
